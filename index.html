<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="PVQC RLSS 六項模擬測驗：拼寫、單字辨識、聽力與發音練習。">
  <title>PVQC RLSS 模擬測驗</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #06101d;
  --panel: #0b1929;
  --panel-2: #102238;
  --ink: #f6f9fc;
  --muted: #9fb1c5;
  --line: rgba(255,255,255,.11);
  --mint: #76e6be;
  --mint-2: #2dc796;
  --yellow: #ffc95c;
  --red: #ff7e84;
  --blue: #7eb7ff;
  --shadow: 0 24px 70px rgba(0,0,0,.3);
  font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); overflow-x: hidden; }
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(118,230,190,.45); outline-offset: 3px; }
.ambient { position: fixed; border-radius: 999px; filter: blur(1px); pointer-events: none; opacity: .7; z-index: -1; }
.ambient-one { width: 440px; height: 440px; right: -220px; top: 70px; background: radial-gradient(circle, rgba(45,199,150,.18), transparent 68%); }
.ambient-two { width: 520px; height: 520px; left: -300px; top: 520px; background: radial-gradient(circle, rgba(74,117,255,.12), transparent 68%); }

.topbar { height: 82px; padding: 0 clamp(20px,5vw,78px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: rgba(6,16,29,.82); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 20; }
.brand { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; }
.brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; color: #06251b; background: var(--mint); font-weight: 900; font-size: 1.25rem; box-shadow: 0 8px 22px rgba(45,199,150,.25); }
.brand strong { display: block; letter-spacing: .16em; font-size: .95rem; }
.brand small { display: block; color: var(--muted); margin-top: 2px; font-size: .75rem; letter-spacing: .08em; }
.top-actions { display: flex; gap: 8px; }
.ghost-btn { border: 1px solid var(--line); background: rgba(255,255,255,.025); border-radius: 999px; padding: 10px 15px; cursor: pointer; transition: .2s; }
.ghost-btn:hover { border-color: rgba(118,230,190,.55); background: rgba(118,230,190,.06); }
.ghost-btn b { display: inline-grid; place-items: center; min-width: 23px; height: 23px; margin-left: 7px; padding: 0 7px; background: var(--mint); color: #06251b; border-radius: 999px; font-size: .75rem; }

main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
.hero { min-height: 650px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 90px 0 70px; position: relative; }
.hero::after { content: "RLSS"; position: absolute; right: -20px; top: 110px; font-size: clamp(7rem,18vw,15rem); font-weight: 900; letter-spacing: -.08em; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.045); z-index: -1; }
.eyebrow, .kicker { color: var(--mint); font-size: .75rem; letter-spacing: .19em; font-weight: 800; text-transform: uppercase; }
.eyebrow { display: flex; align-items: center; gap: 10px; }
.eyebrow span { width: 36px; height: 2px; background: var(--mint); }
h1 { max-width: 820px; margin: 24px 0 22px; font-size: clamp(3rem,7vw,6.25rem); line-height: 1.02; letter-spacing: -.065em; }
h1 em { color: var(--mint); font-style: normal; }
.hero > p { max-width: 660px; color: var(--muted); line-height: 1.9; font-size: 1.05rem; margin: 0; }
.hero-actions { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
.primary-btn, .secondary-btn, .danger-btn { min-height: 50px; padding: 13px 22px; border-radius: 14px; border: 0; cursor: pointer; font-weight: 800; transition: transform .18s, box-shadow .18s, background .18s; }
.primary-btn { background: var(--mint); color: #06251b; box-shadow: 0 12px 28px rgba(45,199,150,.2); }
.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(45,199,150,.28); }
.secondary-btn { background: rgba(255,255,255,.055); border: 1px solid var(--line); }
.secondary-btn:hover { background: rgba(255,255,255,.09); }
.secondary-btn.light { background: var(--ink); color: var(--bg); }
.danger-btn { background: rgba(255,126,132,.12); color: #ffafb3; border: 1px solid rgba(255,126,132,.25); }
.exam-summary { display: flex; gap: 44px; margin-top: 55px; padding-top: 24px; border-top: 1px solid var(--line); }
.exam-summary div { display: flex; align-items: baseline; gap: 9px; }
.exam-summary strong { font-size: 1.65rem; }
.exam-summary span { color: var(--muted); font-size: .88rem; }

.section-block { padding: 90px 0; }
.section-heading { display: flex; justify-content: space-between; gap: 30px; align-items: end; margin-bottom: 30px; }
.section-heading h2, .prep-panel h2 { font-size: clamp(2rem,4vw,3.3rem); letter-spacing: -.045em; margin: 8px 0 0; }
.section-heading p { color: var(--muted); max-width: 420px; line-height: 1.7; margin: 0; }
.test-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
.test-card { min-height: 265px; background: linear-gradient(145deg, rgba(16,34,56,.96), rgba(8,23,38,.96)); border: 1px solid var(--line); border-radius: 22px; padding: 25px; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: transform .2s,border-color .2s; }
.test-card:hover { transform: translateY(-4px); border-color: rgba(118,230,190,.45); }
.test-number { color: var(--mint); font-size: .75rem; font-weight: 900; letter-spacing: .16em; }
.test-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; background: rgba(118,230,190,.1); color: var(--mint); font-size: 1.2rem; position: absolute; right: 22px; top: 22px; }
.test-card h3 { font-size: 1.4rem; margin: 38px 0 10px; }
.test-card p { color: var(--muted); line-height: 1.65; margin: 0; flex: 1; }
.test-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
.test-meta button { border: 0; background: transparent; color: var(--mint); font-weight: 800; cursor: pointer; padding: 6px 0; }
.prep-panel { margin: 30px 0 100px; padding: clamp(28px,5vw,60px); border-radius: 28px; background: linear-gradient(110deg,#1ea879,#43d5a8); color: #06251b; display: flex; align-items: center; justify-content: space-between; gap: 30px; box-shadow: var(--shadow); }
.prep-panel .kicker { color: rgba(6,37,27,.62); }
.prep-panel p { max-width: 660px; margin: 14px 0 0; line-height: 1.7; color: rgba(6,37,27,.78); }

.exam-shell { min-height: calc(100vh - 82px); padding: 34px 0 70px; }
.exam-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; margin-bottom: 22px; }
.exam-top .exit-btn { justify-self: start; }
.module-label { text-align: center; }
.module-label small { display: block; color: var(--muted); letter-spacing: .14em; font-weight: 800; font-size: .7rem; }
.module-label strong { display: block; margin-top: 5px; }
.timer { justify-self: end; font-variant-numeric: tabular-nums; padding: 11px 15px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 900; min-width: 92px; text-align: center; }
.timer.warning { color: var(--yellow); border-color: rgba(255,201,92,.4); }
.progress-line { height: 5px; background: rgba(255,255,255,.07); border-radius: 999px; overflow: hidden; }
.progress-line span { display: block; height: 100%; background: linear-gradient(90deg,var(--mint-2),var(--mint)); border-radius: inherit; transition: width .3s; }
.question-panel { margin: 28px auto 0; max-width: 880px; min-height: 560px; border: 1px solid var(--line); background: rgba(11,25,41,.91); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(25px,5vw,55px); display: flex; flex-direction: column; }
.question-count { color: var(--muted); font-size: .84rem; font-weight: 700; }
.prompt-wrap { text-align: center; margin: auto 0 34px; }
.question-hint { color: var(--muted); font-size: .86rem; margin-bottom: 15px; }
.question-prompt { font-size: clamp(2.3rem,7vw,4.8rem); line-height: 1.18; margin: 0; letter-spacing: -.045em; overflow-wrap: anywhere; }
.question-prompt.chinese { font-size: clamp(2rem,5vw,3.8rem); }
.speaker-btn { width: 92px; height: 92px; border-radius: 50%; border: 1px solid rgba(118,230,190,.3); background: rgba(118,230,190,.1); color: var(--mint); font-size: 2rem; cursor: pointer; transition: .2s; }
.speaker-btn:hover { transform: scale(1.05); background: rgba(118,230,190,.16); }
.speaker-btn.playing { animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 15px rgba(118,230,190,0); } 0% { box-shadow: 0 0 0 0 rgba(118,230,190,.22); } }
.options { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; }
.option { min-height: 68px; border: 1px solid var(--line); background: rgba(255,255,255,.035); border-radius: 15px; text-align: left; padding: 14px 17px; cursor: pointer; display: flex; align-items: center; gap: 13px; font-weight: 700; transition: .16s; }
.option:hover { border-color: rgba(118,230,190,.55); background: rgba(118,230,190,.06); }
.option.selected { border-color: var(--mint); background: rgba(118,230,190,.12); }
.option-key { flex: 0 0 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
.audio-option { justify-content: center; text-align: center; }
.audio-option .option-key { position: absolute; margin-left: -9999px; }
.spell-area { max-width: 600px; margin: 0 auto; width: 100%; }
.spell-input { width: 100%; border: 1px solid var(--line); background: #071523; color: var(--ink); border-radius: 16px; padding: 18px 20px; text-align: center; font-size: 1.4rem; letter-spacing: .04em; }
.spell-input::placeholder { color: #617589; }
.exam-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; gap: 16px; }
.exam-footer small { color: var(--muted); }

.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(1,7,13,.78); backdrop-filter: blur(10px); display: grid; place-items: center; padding: 20px; }
.modal { width: min(720px,100%); max-height: min(760px,calc(100vh - 40px)); overflow: auto; background: #0c1b2c; border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); }
.modal.wide { width: min(980px,100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
.modal-head h2 { margin: 0; font-size: 1.75rem; }
.modal-head p { margin: 8px 0 0; color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border-radius: 11px; background: rgba(255,255,255,.05); border: 1px solid var(--line); cursor: pointer; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 15px; }
.field label { display: block; color: var(--muted); margin-bottom: 8px; font-size: .85rem; }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #071523; color: var(--ink); padding: 12px 14px; }
.field textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
.check-row { display: flex; align-items: center; gap: 10px; color: var(--muted); margin: 16px 0; }
.check-row input { accent-color: var(--mint-2); width: 18px; height: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.note { color: var(--muted); font-size: .84rem; line-height: 1.7; padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.025); }
.bank-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.bank-search { flex: 1; min-width: 210px; border: 1px solid var(--line); background: #071523; color: var(--ink); border-radius: 12px; padding: 11px 14px; }
.word-list { display: grid; gap: 8px; }
.word-row { display: grid; grid-template-columns: minmax(130px,1fr) minmax(130px,1fr) auto; gap: 14px; align-items: center; padding: 13px 15px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.025); }
.word-row strong { overflow-wrap: anywhere; }
.word-row span { color: var(--muted); }
.word-row button { border: 0; background: transparent; color: var(--red); cursor: pointer; }
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 25px; }
.stat-card { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.stat-card strong { display: block; font-size: 1.8rem; }
.stat-card span { color: var(--muted); font-size: .82rem; }
.history-list { display: grid; gap: 10px; }
.history-row { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 15px; border-radius: 13px; border: 1px solid var(--line); }
.history-row small { color: var(--muted); display: block; margin-top: 3px; }
.score { color: var(--mint); font-weight: 900; }

.result-shell { padding: 65px 0 100px; max-width: 900px; margin: 0 auto; text-align: center; }
.result-ring { width: 185px; height: 185px; border-radius: 50%; display: grid; place-items: center; margin: 20px auto 25px; position: relative; background: conic-gradient(var(--mint) var(--score),rgba(255,255,255,.08) 0); }
.result-ring::after { content: ""; position: absolute; inset: 13px; border-radius: inherit; background: var(--bg); }
.result-ring div { position: relative; z-index: 1; }
.result-ring strong { display: block; font-size: 3rem; letter-spacing: -.05em; }
.result-ring span { color: var(--muted); font-size: .8rem; }
.result-shell h1 { font-size: clamp(2.3rem,6vw,4.4rem); margin: 0; }
.result-shell > p { color: var(--muted); }
.result-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 32px 0; }
.review-list { text-align: left; display: grid; gap: 10px; margin-top: 28px; }
.review-item { border: 1px solid var(--line); border-radius: 14px; padding: 15px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: rgba(255,255,255,.025); }
.review-item span { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 45px 15px; border: 1px dashed var(--line); border-radius: 14px; }
#toast { position: fixed; left: 50%; bottom: 28px; z-index: 80; transform: translate(-50%,30px); opacity: 0; padding: 12px 18px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 800; pointer-events: none; transition: .25s; box-shadow: var(--shadow); }
#toast.show { transform: translate(-50%,0); opacity: 1; }

@media (max-width: 860px) {
  .test-grid { grid-template-columns: repeat(2,1fr); }
  .hero { min-height: 590px; }
  .hero::after { display: none; }
  .prep-panel { align-items: flex-start; flex-direction: column; }
}
@media (max-width: 620px) {
  .topbar { height: 70px; padding: 0 16px; }
  .top-actions .ghost-btn { padding: 9px 11px; font-size: .8rem; }
  .top-actions .ghost-btn:first-child span { display: none; }
  main { width: min(100% - 28px,1180px); }
  .hero { padding: 70px 0 50px; min-height: auto; }
  h1 { font-size: 3.1rem; }
  .exam-summary { gap: 18px; width: 100%; justify-content: space-between; }
  .exam-summary div { display: block; }
  .exam-summary span { display: block; margin-top: 3px; }
  .section-heading { display: block; }
  .section-heading p { margin-top: 13px; }
  .test-grid { grid-template-columns: 1fr; }
  .test-card { min-height: 235px; }
  .options { grid-template-columns: 1fr; }
  .question-panel { min-height: 530px; padding: 24px 18px; border-radius: 21px; }
  .exam-top { grid-template-columns: auto 1fr auto; }
  .module-label strong { font-size: .8rem; }
  .form-row { grid-template-columns: 1fr; }
  .stats-grid, .result-stats { grid-template-columns: 1fr; }
  .word-row { grid-template-columns: 1fr auto; }
  .word-row span { grid-column: 1 / -1; grid-row: 2; }
  .review-item { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="topbar">
    <button class="brand" data-action="home" aria-label="回到首頁">
      <span class="brand-mark">P</span>
      <span><strong>PVQC</strong><small>RLSS 模擬測驗</small></span>
    </button>
    <nav class="top-actions" aria-label="主要功能">
      <button class="ghost-btn" data-action="show-bank"><span>單字庫</span><b id="bankCount">0</b></button>
      <button class="ghost-btn" data-action="show-history">學習紀錄</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <template id="homeTemplate">
    <section class="hero">
      <div class="eyebrow"><span></span>Vocabulary Qualification Practice</div>
      <h1>把每一次練習，<br><em>變成考場上的把握。</em></h1>
      <p>依照 PVQC RLSS 考試節奏設計，完整練習單字的讀、聽、拼寫與發音。系統會自動計時、計分，並保存錯題。</p>
      <div class="hero-actions">
        <button class="primary-btn" data-action="start-full">開始完整模擬考</button>
        <button class="secondary-btn" data-action="quick-practice">自訂練習</button>
      </div>
      <div class="exam-summary" aria-label="考試摘要">
        <div><strong>6</strong><span>測驗項目</span></div>
        <div><strong>600</strong><span>完整題數</span></div>
        <div><strong>70</strong><span>分鐘</span></div>
      </div>
    </section>

    <section class="section-block">
      <div class="section-heading">
        <div><span class="kicker">TEST MODULES</span><h2>六項測驗</h2></div>
        <p>點選任一項目可單獨練習，每次都會重新隨機出題。</p>
      </div>
      <div class="test-grid" id="testGrid"></div>
    </section>

    <section class="prep-panel">
      <div>
        <span class="kicker">BEFORE YOU START</span>
        <h2>先確認你的聲音</h2>
        <p>聽力與發音題會使用瀏覽器的英文語音。建議戴上耳機，並先播放測試音。</p>
      </div>
      <button class="secondary-btn light" data-action="sound-check">播放測試音</button>
    </section>
  </template>

  <script>
const TESTS = [
  { id: 1, title: "拼寫測驗", short: "聽音拼字", desc: "聽英文發音，完整輸入正確的英文單字。", icon: "⌨", minutes: 20, type: "spell" },
  { id: 2, title: "中文選英文", short: "中選英", desc: "看到中文意思，從四個選項找出正確英文。", icon: "中", minutes: 10, type: "zh-en" },
  { id: 3, title: "英文選中文", short: "英選中", desc: "看到英文單字，選出最符合的中文意思。", icon: "A", minutes: 10, type: "en-zh" },
  { id: 4, title: "聽英文選中文", short: "聽英選中", desc: "播放英文發音後，從四個選項選擇中文意思。", icon: "♫", minutes: 10, type: "listen-zh" },
  { id: 5, title: "中文選發音", short: "中選音", desc: "看到中文意思，播放並選出正確的英文發音。", icon: "◉", minutes: 10, type: "zh-audio" },
  { id: 6, title: "發音選英文", short: "音選英", desc: "聽英文發音，從四個選項找出正確拼字。", icon: "Aa", minutes: 10, type: "audio-en" }
];

const DEFAULT_WORDS = [
  ["ability","能力"],["accept","接受"],["access","存取；使用權"],["account","帳戶"],["achieve","達成"],
  ["address","位址；地址"],["advance","進步；前進"],["advantage","優點"],["advertise","廣告宣傳"],["affect","影響"],
  ["allow","允許"],["amount","數量"],["application","應用程式；申請"],["appointment","約會；預約"],["appropriate","適當的"],
  ["arrange","安排"],["available","可用的"],["balance","平衡；餘額"],["benefit","利益；好處"],["budget","預算"],
  ["calculate","計算"],["career","職業生涯"],["category","類別"],["charge","費用；充電"],["client","客戶"],
  ["communication","溝通；通訊"],["compare","比較"],["complete","完成；完整的"],["computer","電腦"],["confirm","確認"],
  ["connect","連接"],["consumer","消費者"],["contact","聯絡"],["contract","合約"],["convenient","方便的"],
  ["customer","顧客"],["database","資料庫"],["deadline","截止期限"],["decision","決定"],["department","部門"],
  ["describe","描述"],["device","裝置"],["document","文件"],["efficient","有效率的"],["employee","員工"],
  ["equipment","設備"],["experience","經驗"],["feature","功能；特色"],["financial","財務的"],["improve","改善"],
  ["information","資訊"],["install","安裝"],["instruction","指示；說明"],["inventory","庫存"],["management","管理"],
  ["network","網路"],["opportunity","機會"],["password","密碼"],["performance","表現；效能"],["permission","權限；許可"],
  ["product","產品"],["professional","專業的"],["purchase","購買"],["recommend","推薦"],["register","註冊"],
  ["require","需要；要求"],["schedule","行程；排程"],["security","安全性"],["service","服務"],["software","軟體"],
  ["solution","解決方案"],["support","支援"],["system","系統"],["technology","科技"],["transaction","交易"],
  ["update","更新"],["upgrade","升級"],["website","網站"],["wireless","無線的"],["workplace","工作場所"]
].map((item,index) => ({ id: `seed-${index+1}`, en: item[0], zh: item[1] }));

const app = document.querySelector("#app");
const modalRoot = document.querySelector("#modalRoot");
const state = {
  words: load("pvqc_words", DEFAULT_WORDS),
  history: load("pvqc_history", []),
  session: null,
  timer: null
};

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
}
function save(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
function escapeHTML(value="") { return String(value).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c])); }
function shuffle(list) { const a=[...list]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(message) { const el=document.querySelector("#toast"); el.textContent=message; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2100); }
function updateBankCount() { document.querySelector("#bankCount").textContent=state.words.length; }
function formatTime(sec) { const s=Math.max(0,sec); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }

function speak(text, rate=.86) {
  if (!window.speechSynthesis) { toast("此瀏覽器不支援語音播放"); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate; u.pitch=1;
  const voice=speechSynthesis.getVoices().find(v=>/^en(-|_)/i.test(v.lang)); if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}

function renderHome() {
  stopTimer();
  app.innerHTML=document.querySelector("#homeTemplate").innerHTML;
  const grid=app.querySelector("#testGrid");
  grid.innerHTML=TESTS.map(test=>`
    <article class="test-card">
      <span class="test-number">TEST ${String(test.id).padStart(2,"0")}</span>
      <span class="test-icon" aria-hidden="true">${test.icon}</span>
      <h3>${test.title}</h3><p>${test.desc}</p>
      <div class="test-meta"><span>${test.minutes} 分鐘 · 100 題</span><button data-start-test="${test.id}">開始練習</button></div>
    </article>`).join("");
  window.scrollTo({top:0,behavior:"smooth"});
}

function openModal(content, wide=false) {
  modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">${content}</section></div>`;
  const backdrop=modalRoot.querySelector(".modal-backdrop");
  backdrop.addEventListener("click",event=>{
    if(event.target===backdrop) closeModal();
  });
}
function closeModal(){ modalRoot.innerHTML=""; }
function modalHead(title, sub="") { return `<div class="modal-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}</div><button class="icon-btn" data-action="close-modal" aria-label="關閉">✕</button></div>`; }

function showStartModal(moduleId=null) {
  const full=moduleId===null;
  openModal(`${modalHead(full?"完整模擬考設定":"單項練習設定", full?"依正式順序完成六項測驗，系統會保存各項成績。":"選擇本次練習的題數與時間。")}
    <div class="form-row">
      ${full?`<div class="field"><label>考試內容</label><select id="fullMode"><option value="all">六項完整考試（70 分鐘）</option><option value="skip">略過拼寫測驗（50 分鐘）</option></select></div>`:`<div class="field"><label>測驗項目</label><input value="${escapeHTML(TESTS[moduleId-1].title)}" disabled></div>`}
      <div class="field"><label>每項題數</label><select id="questionCount"><option value="10">10 題（快速練習）</option><option value="20">20 題</option><option value="50">50 題</option><option value="100" selected>100 題（正式題數）</option></select></div>
    </div>
    <label class="check-row"><input type="checkbox" id="instantFeedback"> 作答後立即顯示對錯（練習模式）</label>
    <div class="note">目前單字庫有 ${state.words.length} 筆。題目會隨機排列；單字不足題數時，系統會循環抽題。</div>
    <div class="modal-actions"><button class="secondary-btn" data-action="close-modal">取消</button><button class="primary-btn" data-action="confirm-start" data-module="${full?"full":moduleId}">開始測驗</button></div>`);
}

function buildQuestions(test, count) {
  if(state.words.length<4) return [];
  let pool=shuffle(state.words), questions=[];
  for(let i=0;i<count;i++) {
    if(i && i%pool.length===0) pool=shuffle(state.words);
    const word=pool[i%pool.length];
    const distractors=shuffle(state.words.filter(w=>w.id!==word.id)).slice(0,3);
    let options=[];
    if(["zh-en","audio-en"].includes(test.type)) options=shuffle([word,...distractors]).map(w=>({label:w.en,value:w.id}));
    if(["en-zh","listen-zh"].includes(test.type)) options=shuffle([word,...distractors]).map(w=>({label:w.zh,value:w.id}));
    if(test.type==="zh-audio") options=shuffle([word,...distractors]).map(w=>({label:"播放發音",value:w.id,audio:w.en}));
    questions.push({word,options,answer:null,correct:false});
  }
  return questions;
}

function startSession(moduleIds, count, feedback=false) {
  if(state.words.length<4){ closeModal(); showBank(); toast("請先加入至少 4 個單字"); return; }
  closeModal();
  state.session={ moduleIds, moduleIndex:0, count, feedback, moduleResults:[], startedAt:Date.now(), questionIndex:0, questions:[] };
  startModule();
}

function startModule() {
  const s=state.session, test=TESTS.find(t=>t.id===s.moduleIds[s.moduleIndex]);
  s.test=test; s.questions=buildQuestions(test,s.count); s.questionIndex=0; s.seconds=test.minutes*60;
  renderQuestion(); startTimer();
}

function startTimer() {
  stopTimer();
  state.timer=setInterval(()=>{
    const s=state.session; if(!s) return stopTimer();
    s.seconds--;
    const timer=document.querySelector("#timer");
    if(timer){ timer.textContent=formatTime(s.seconds); timer.classList.toggle("warning",s.seconds<=60); }
    if(s.seconds<=0){ toast("時間到，已自動交卷"); finishModule(); }
  },1000);
}
function stopTimer(){ if(state.timer){clearInterval(state.timer);state.timer=null;} }

function renderQuestion() {
  const s=state.session, q=s.questions[s.questionIndex], test=s.test;
  const progress=((s.questionIndex+1)/s.questions.length)*100;
  let prompt="", answerArea="";
  if(test.type==="spell") {
    prompt=`<div class="question-hint">聆聽發音，輸入完整英文單字</div><button class="speaker-btn" data-speak="${escapeHTML(q.word.en)}" aria-label="播放英文發音">♫</button>`;
    answerArea=`<div class="spell-area"><input class="spell-input" id="spellInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="請輸入英文拼字" value="${escapeHTML(q.answer||"")}"></div>`;
  } else if(test.type==="listen-zh" || test.type==="audio-en") {
    prompt=`<div class="question-hint">聆聽後選出正確答案</div><button class="speaker-btn" data-speak="${escapeHTML(q.word.en)}" aria-label="播放英文發音">♫</button>`;
    answerArea=optionsHTML(q.options,q.answer);
  } else if(test.type==="zh-audio") {
    prompt=`<div class="question-hint">選出與中文意思相符的發音</div><h2 class="question-prompt chinese">${escapeHTML(q.word.zh)}</h2>`;
    answerArea=optionsHTML(q.options,q.answer,true);
  } else {
    const isZh=test.type==="zh-en";
    prompt=`<div class="question-hint">${isZh?"選出正確的英文單字":"選出正確的中文意思"}</div><h2 class="question-prompt ${isZh?"chinese":""}">${escapeHTML(isZh?q.word.zh:q.word.en)}</h2>`;
    answerArea=optionsHTML(q.options,q.answer);
  }
  app.innerHTML=`<section class="exam-shell">
    <div class="exam-top"><button class="ghost-btn exit-btn" data-action="exit-exam">結束</button><div class="module-label"><small>TEST ${String(test.id).padStart(2,"0")}</small><strong>${test.title}</strong></div><div class="timer" id="timer">${formatTime(s.seconds)}</div></div>
    <div class="progress-line"><span style="width:${progress}%"></span></div>
    <article class="question-panel">
      <div class="question-count">第 ${s.questionIndex+1} 題 / 共 ${s.questions.length} 題</div>
      <div class="prompt-wrap">${prompt}</div>
      ${answerArea}
      <div class="exam-footer"><small>${s.moduleIds.length>1?`完整考試 ${s.moduleIndex+1}/${s.moduleIds.length}`:"可使用鍵盤 1–4 快速作答"}</small><button class="primary-btn" data-action="next-question">${s.questionIndex===s.questions.length-1?"完成本項":"下一題"}</button></div>
    </article></section>`;
  const spell=app.querySelector("#spellInput"); if(spell) setTimeout(()=>spell.focus(),30);
  if(["listen-zh","audio-en","spell"].includes(test.type)) setTimeout(()=>speak(q.word.en),350);
  window.scrollTo(0,0);
}

function optionsHTML(options,answer,audio=false) {
  return `<div class="options">${options.map((o,i)=>`<button class="option ${answer===o.value?"selected":""} ${audio?"audio-option":""}" data-option="${escapeHTML(o.value)}" ${audio?`data-option-audio="${escapeHTML(o.audio)}"`:""}><span class="option-key">${i+1}</span><span>${audio?"♫ 播放選項":escapeHTML(o.label)}</span></button>`).join("")}</div>`;
}

function chooseOption(value) {
  const q=state.session.questions[state.session.questionIndex]; q.answer=value;
  document.querySelectorAll(".option").forEach(el=>el.classList.toggle("selected",el.dataset.option===value));
  if(state.session.feedback) toast(value===q.word.id?"答對了":"先記住這一題，完成後可複習");
}

function nextQuestion() {
  const s=state.session, q=s.questions[s.questionIndex];
  if(s.test.type==="spell") q.answer=(document.querySelector("#spellInput")?.value||"").trim().toLowerCase();
  if(!q.answer){ toast("請先作答"); return; }
  q.correct=s.test.type==="spell"?q.answer===q.word.en.toLowerCase():q.answer===q.word.id;
  if(s.questionIndex<s.questions.length-1){ s.questionIndex++; renderQuestion(); }
  else finishModule();
}

function finishModule() {
  stopTimer();
  const s=state.session;
  s.questions.forEach(q=>{
    if(q.answer===null) q.correct=false;
    else if(s.test.type==="spell") q.correct=String(q.answer).trim().toLowerCase()===q.word.en.toLowerCase();
    else q.correct=q.answer===q.word.id;
  });
  s.moduleResults.push({ test:s.test, questions:s.questions, secondsLeft:s.seconds });
  if(s.moduleIndex<s.moduleIds.length-1) {
    s.moduleIndex++;
    const next=TESTS.find(t=>t.id===s.moduleIds[s.moduleIndex]);
    openModal(`${modalHead("本項測驗完成")}
      <div class="note">下一項：${next.title}，共 ${s.count} 題、限時 ${next.minutes} 分鐘。</div>
      <div class="modal-actions"><button class="primary-btn" data-action="continue-exam">繼續下一項</button></div>`);
  } else finishSession();
}

function finishSession() {
  stopTimer(); closeModal();
  const s=state.session;
  const all=s.moduleResults.flatMap(r=>r.questions), correct=all.filter(q=>q.correct).length;
  const result={ id:Date.now(), date:new Date().toISOString(), modules:s.moduleResults.map(r=>r.test.id), title:s.moduleResults.length>1?"完整模擬考":s.moduleResults[0].test.title, total:all.length, correct, percent:Math.round(correct/all.length*100), wrong:all.filter(q=>!q.correct).map(q=>({en:q.word.en,zh:q.word.zh,answer:q.answer})) };
  state.history.unshift(result); state.history=state.history.slice(0,30); save("pvqc_history",state.history);
  renderResult(result);
}

function renderResult(result) {
  const wrong=result.wrong;
  app.innerHTML=`<section class="result-shell">
    <span class="kicker">RESULT</span><h1>${result.percent>=80?"表現很穩，繼續保持。":result.percent>=60?"已經有基礎，再補強錯題。":"先從錯題開始，會進步得更快。"}</h1>
    <div class="result-ring" style="--score:${result.percent*3.6}deg"><div><strong>${result.percent}</strong><span>總分 / 100</span></div></div>
    <p>${escapeHTML(result.title)}已完成，成績已儲存在這台裝置。</p>
    <div class="result-stats"><div class="stat-card"><strong>${result.correct}</strong><span>答對題數</span></div><div class="stat-card"><strong>${result.total - result.correct}</strong><span>答錯題數</span></div><div class="stat-card"><strong>${result.total}</strong><span>總題數</span></div></div>
    <div class="hero-actions" style="justify-content:center"><button class="primary-btn" data-action="home">回首頁</button><button class="secondary-btn" data-action="retry">再練一次</button></div>
    ${wrong.length?`<div class="review-list"><div class="section-heading"><div><span class="kicker">REVIEW</span><h2>本次錯題</h2></div><p>點擊英文單字可以再次聆聽發音。</p></div>${wrong.slice(0,100).map(w=>`<button class="review-item" data-speak="${escapeHTML(w.en)}"><strong>${escapeHTML(w.en)}</strong><span>${escapeHTML(w.zh)}</span></button>`).join("")}</div>`:`<div class="empty" style="margin-top:30px">全部答對，太棒了！</div>`}
  </section>`;
  state.lastResult=result;
  state.session=null;
  window.scrollTo({top:0,behavior:"smooth"});
}

function showCustomPractice() {
  openModal(`${modalHead("自訂練習","選擇一個測驗項目，再設定題數。")}
    <div class="field"><label>測驗項目</label><select id="customModule">${TESTS.map(t=>`<option value="${t.id}">${t.id}. ${t.title}</option>`).join("")}</select></div>
    <div class="field" style="margin-top:15px"><label>題數</label><select id="questionCount"><option value="10">10 題</option><option value="20" selected>20 題</option><option value="50">50 題</option><option value="100">100 題</option></select></div>
    <label class="check-row"><input type="checkbox" id="instantFeedback" checked> 作答後立即提示對錯</label>
    <div class="modal-actions"><button class="secondary-btn" data-action="close-modal">取消</button><button class="primary-btn" data-action="confirm-custom">開始練習</button></div>`);
}

function showBank() {
  openModal(`${modalHead("我的單字庫",`目前共有 ${state.words.length} 個單字，資料只儲存在這台裝置的瀏覽器。`)}
    <div class="bank-toolbar"><input id="bankSearch" class="bank-search" placeholder="搜尋英文或中文"><button class="secondary-btn" data-action="import-bank">匯入單字</button><button class="secondary-btn" data-action="reset-bank">還原範例</button></div>
    <div id="wordList" class="word-list"></div>`,true);
  renderWordList();
}
function renderWordList(filter="") {
  const list=document.querySelector("#wordList"); if(!list) return;
  const words=state.words.filter(w=>`${w.en} ${w.zh}`.toLowerCase().includes(filter.toLowerCase()));
  list.innerHTML=words.length?words.map(w=>`<div class="word-row"><strong>${escapeHTML(w.en)}</strong><span>${escapeHTML(w.zh)}</span><button data-delete-word="${escapeHTML(w.id)}">刪除</button></div>`).join(""):`<div class="empty">找不到符合的單字</div>`;
}
function showImport() {
  openModal(`${modalHead("匯入單字","每行一筆，格式為：英文,中文。也支援 Tab 分隔。")}
    <div class="field"><label>貼上單字資料</label><textarea id="importText" placeholder="computer,電腦\nnetwork,網路\nsoftware,軟體"></textarea></div>
    <label class="check-row"><input type="checkbox" id="replaceWords"> 清空原單字庫後再匯入</label>
    <div class="note">重複的英文單字會自動略過。匯入後即可用於全部六種測驗。</div>
    <div class="modal-actions"><button class="secondary-btn" data-action="show-bank">返回</button><button class="primary-btn" data-action="confirm-import">匯入</button></div>`);
}
function importWords() {
  const text=document.querySelector("#importText").value.trim(); if(!text){toast("請先貼上單字");return;}
  const rows=text.split(/\r?\n/).map(line=>line.split(/\t|,/).map(s=>s.trim())).filter(r=>r[0]&&r[1]);
  if(!rows.length){toast("找不到可匯入的資料");return;}
  let base=document.querySelector("#replaceWords").checked?[]:[...state.words], added=0;
  rows.forEach(([en,zh])=>{ if(!base.some(w=>w.en.toLowerCase()===en.toLowerCase())){base.push({id:`user-${Date.now()}-${added}`,en,zh});added++;} });
  state.words=base; save("pvqc_words",state.words); updateBankCount(); showBank(); toast(`已匯入 ${added} 個單字`);
}

function showHistory() {
  const attempts=state.history.length, total=state.history.reduce((n,r)=>n+r.total,0), avg=attempts?Math.round(state.history.reduce((n,r)=>n+r.percent,0)/attempts):0;
  openModal(`${modalHead("學習紀錄","最多保留最近 30 次測驗成績。")}
    <div class="stats-grid"><div class="stat-card"><strong>${attempts}</strong><span>測驗次數</span></div><div class="stat-card"><strong>${total}</strong><span>累積作答</span></div><div class="stat-card"><strong>${avg}</strong><span>平均分數</span></div></div>
    <div class="history-list">${attempts?state.history.map(r=>`<div class="history-row"><div><strong>${escapeHTML(r.title)}</strong><small>${new Date(r.date).toLocaleString("zh-TW")}</small></div><span>${r.correct}/${r.total}</span><span class="score">${r.percent} 分</span></div>`).join(""):`<div class="empty">尚無測驗紀錄</div>`}</div>
    ${attempts?`<div class="modal-actions"><button class="danger-btn" data-action="clear-history">清除紀錄</button></div>`:""}`,true);
}

document.addEventListener("click",event=>{
  const action=event.target.closest("[data-action]")?.dataset.action;
  const start=event.target.closest("[data-start-test]")?.dataset.startTest;
  const option=event.target.closest("[data-option]");
  const speaker=event.target.closest("[data-speak]");
  const del=event.target.closest("[data-delete-word]")?.dataset.deleteWord;
  if(speaker){speak(speaker.dataset.speak);}
  if(option){ if(option.dataset.optionAudio) speak(option.dataset.optionAudio); chooseOption(option.dataset.option); }
  if(start) showStartModal(Number(start));
  if(del){ state.words=state.words.filter(w=>w.id!==del);save("pvqc_words",state.words);updateBankCount();renderWordList(document.querySelector("#bankSearch")?.value||""); }
  if(!action) return;
  if(action==="home") renderHome();
  if(action==="show-bank") showBank();
  if(action==="show-history") showHistory();
  if(action==="close-modal") closeModal();
  if(action==="start-full") showStartModal();
  if(action==="quick-practice") showCustomPractice();
  if(action==="sound-check") { speak("Welcome to the PVQC practice test."); toast("正在播放測試音"); }
  if(action==="confirm-start") {
    const mod=event.target.closest("[data-module]").dataset.module, count=Number(document.querySelector("#questionCount").value), feedback=document.querySelector("#instantFeedback").checked;
    const ids=mod==="full"?(document.querySelector("#fullMode").value==="skip"?[2,3,4,5,6]:[1,2,3,4,5,6]):[Number(mod)]; startSession(ids,count,feedback);
  }
  if(action==="confirm-custom") startSession([Number(document.querySelector("#customModule").value)],Number(document.querySelector("#questionCount").value),document.querySelector("#instantFeedback").checked);
  if(action==="next-question") nextQuestion();
  if(action==="continue-exam") { closeModal(); startModule(); }
  if(action==="exit-exam") { if(confirm("確定要結束這次測驗嗎？目前進度不會保存。")){state.session=null;stopTimer();renderHome();} }
  if(action==="retry") { const ids=state.lastResult.modules; startSession(ids,state.lastResult.total/ids.length,false); }
  if(action==="import-bank") showImport();
  if(action==="confirm-import") importWords();
  if(action==="reset-bank") { if(confirm("要還原成系統內建的範例單字嗎？")){state.words=DEFAULT_WORDS;save("pvqc_words",state.words);updateBankCount();showBank();} }
  if(action==="clear-history") { if(confirm("確定清除所有學習紀錄？")){state.history=[];save("pvqc_history",[]);showHistory();} }
});

document.addEventListener("input",event=>{
  if(event.target.id==="bankSearch") renderWordList(event.target.value);
});
document.addEventListener("keydown",event=>{
  if(!state.session || modalRoot.innerHTML) return;
  if(event.key==="Enter"){ event.preventDefault(); nextQuestion(); }
  if(["1","2","3","4"].includes(event.key)) document.querySelectorAll(".option")[Number(event.key)-1]?.click();
});

updateBankCount();
renderHome();

</script>
</body>
</html>
